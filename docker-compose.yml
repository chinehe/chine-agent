services:
  postgres:
    image: postgres:17-alpine
    container_name: chine-agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # 仅本地开发用，与 .env.example 一致
      POSTGRES_DB: chine_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # 数据持久化，删掉容器数据也还在
    healthcheck:
      # 必须加 -h 127.0.0.1：容器首次初始化时，PostgreSQL 会先启动一个只监听 socket 的临时实例，
      # 不加 -h 时检查走 socket，会过早显示 healthy，但这时外部还连不上
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d chine_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- 以下服务只在 --profile app 时启动，日常开发 docker compose up -d 仍只起数据库 ----------
  migrate:
    profiles: ["app"]
    build: .
    image: chine-agent:local
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      APP_ENV: prod
      # 容器之间用服务名 postgres 访问，不是 localhost
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/chine_agent
      # 从宿主机的 .env 或环境变量读取；未设置时直接报错，不会用空密钥启动
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在 .env 中设置 JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["app"]
    image: chine-agent:local
    environment: *app-env
    ports:
      - "8080:8000"   # 宿主机用 8080，避免和本地 fastapi dev 的 8000 冲突
    depends_on:
      migrate:
        condition: service_completed_successfully   # 迁移成功后才启动应用
    healthcheck:
      # 镜像里没有 curl，用 Python 自带的 urllib 请求就绪接口
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
